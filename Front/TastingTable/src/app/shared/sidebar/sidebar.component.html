<aside class="sidebar"
  [class.sidebar--open]="open"
  [class.sidebar--mobile]="mobile">

  <nav class="sidebar-nav">
    <a href="#" class="sidebar-link active">
      <span class="sidebar-icon">&#x1F3E0;</span>
      <span class="sidebar-label">Home</span>
    </a>
    <a routerLink="/recipes" class="sidebar-link">
      <span class="sidebar-icon">&#x1F4D6;</span>
      <span class="sidebar-label">Recipes</span>
    </a>
    <a href="#features" class="sidebar-link">
      <span class="sidebar-icon">&#x2728;</span>
      <span class="sidebar-label">Features</span>
    </a>
    <a href="#categories" class="sidebar-link">
      <span class="sidebar-icon">&#x1F3F7;&#xFE0F;</span>
      <span class="sidebar-label">Categories</span>
    </a>
    @if (auth.isLoggedIn()) {
      <a routerLink="/my-kitchen" class="sidebar-link">
        <span class="sidebar-icon">&#x1F373;</span>
        <span class="sidebar-label">My Kitchen</span>
      </a>
      <a routerLink="/friends" class="sidebar-link">
        <span class="sidebar-icon">&#x1F91D;</span>
        <span class="sidebar-label">Friends</span>
      </a>
    }
    @if (auth.isAdmin()) {
      <a routerLink="/admin" class="sidebar-link sidebar-link--admin">
        <span class="sidebar-icon">&#x2699;&#xFE0F;</span>
        <span class="sidebar-label">Admin</span>
      </a>
    }
  </nav>

</aside>
