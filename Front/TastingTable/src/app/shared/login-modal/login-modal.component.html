<div class="modal-backdrop" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <button class="modal-close" (click)="close()">&#x2715;</button>
    <div class="modal-icon">&#x1F512;</div>
    <h2 class="modal-title">Login Required</h2>
    <p class="modal-message">Please log in to {{ action }}.</p>
    <div class="modal-actions">
      <button class="btn-primary" (click)="login()">Login</button>
      <button class="btn-outline" (click)="register()">Create Account</button>
    </div>
  </div>
</div>
