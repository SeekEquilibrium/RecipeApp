<nav class="nav">
  <div class="nav-left">
    <button class="hamburger" (click)="toggleSidebar()" aria-label="Toggle sidebar">
      <span></span><span></span><span></span>
    </button>
    <a routerLink="/" class="nav-logo">
      <span class="logo-icon">&#x1F373;</span>
      <span class="logo-text">TastingTable</span>
    </a>
  </div>

  <div class="nav-center">
    <a routerLink="/" class="nav-link">Home</a>
    <a routerLink="/recipes" class="nav-link">Recipes</a>
    <a href="#features" class="nav-link">Features</a>
    <a href="#categories" class="nav-link">Categories</a>
    <ng-container *ngIf="auth.isLoggedIn()">
      <a routerLink="/my-kitchen" class="nav-link">My Kitchen</a>
      <a routerLink="/friends" class="nav-link">Friends</a>
    </ng-container>
    <ng-container *ngIf="auth.isAdmin()">
      <a routerLink="/admin" class="nav-link nav-link--admin">Admin</a>
    </ng-container>
  </div>

  <div class="nav-right">
    <ng-container *ngIf="auth.isLoggedIn(); else guestButtons">
      <span class="nav-username">{{ auth.currentUser()?.name }}</span>
      <button class="btn-outline" (click)="logout()">Logout</button>
    </ng-container>
    <ng-template #guestButtons>
      <a routerLink="/login" class="btn-outline">Login</a>
      <a routerLink="/register" class="btn-primary">Get Started</a>
    </ng-template>
  </div>
</nav>
